# せつめいナビ 静的配信のみの構成（最小構成）
#
# 院内サーバー機能（マスタ共有・記録保存）を使わない場合は、
# ビルド結果 dist/ をこの設定で配信するだけで運用できます。
#
#   1) npm run build
#   2) dist/ を /var/www/setsumei-navi にコピー
#   3) この設定を /etc/nginx/conf.d/setsumei-navi.conf として配置し nginx を再読み込み
#
# 院内LANのみでの利用を前提としています。インターネットに公開する場合は
# TLS の設定と認証を必ず追加し、docs/03_セキュリティと法令対応.md を確認してください。

server {
    listen       80;
    # 院内LANのIPアドレスまたはホスト名を指定する
    server_name  setsumei.clinic.local;

    root  /var/www/setsumei-navi;
    index index.html;

    # 患者情報を扱う画面のため、検索エンジンやキャッシュに残さない
    add_header X-Robots-Tag        "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff"        always;
    add_header X-Frame-Options     "DENY"              always;
    add_header Referrer-Policy     "no-referrer"       always;
    # 外部との通信を一切行わないアプリなので、接続先を自分自身に限定する
    add_header Content-Security-Policy
        "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    # index.html はキャッシュせず、ハッシュ付きの資産は長期キャッシュする
    location = /index.html {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # SPA のため、見つからないパスは index.html に流す
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;

    access_log /var/log/nginx/setsumei-navi.access.log;
    error_log  /var/log/nginx/setsumei-navi.error.log warn;
}
